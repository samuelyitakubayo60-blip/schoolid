services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: school_id_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  web:
    build: .
    ports: ["8080:10000"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: school_id_platform
      DB_USERNAME: postgres
      DB_PASSWORD: local-development-only
      DB_SSLMODE: disable
      OWNER_NAME: Platform Owner
      OWNER_EMAIL: owner@example.com
      OWNER_PASSWORD: change-this-local-password
    depends_on: [db]
volumes:
  pgdata:
